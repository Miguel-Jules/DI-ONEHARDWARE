<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DI-One Hardware – Login</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .role-tabs { display: flex; gap: 0; margin-bottom: 22px; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border); }
    .role-tab { flex: 1; padding: 9px; background: #f8fafc; border: none; cursor: pointer; font-size: 0.88rem; font-family: var(--font); font-weight: 500; color: var(--text-muted); transition: all 0.18s; }
    .role-tab.active { background: var(--primary); color: #fff; }
    .credentials-hint { background: #f0f4f8; border-radius: 8px; padding: 12px 14px; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 18px; }
    .credentials-hint strong { color: var(--primary); }
    .credentials-hint div { margin-top: 4px; }
    .login-footer { text-align: center; margin-top: 18px; font-size: 0.75rem; color: var(--text-muted); }
    .error-msg { display: none; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <h1><span>DI-ONE</span> Hardware</h1>
        <p>Management System &nbsp;|&nbsp; BSIT-3B</p>
      </div>

      <div class="role-tabs">
        <button class="role-tab active" onclick="switchRole('owner')" id="tab-owner">👑 Owner / Manager</button>
        <button class="role-tab" onclick="switchRole('staff')" id="tab-staff">🧑‍💼 Staff</button>
      </div>

      <div class="credentials-hint" id="hint-owner">
        <strong>Demo Credentials:</strong>
        <div>Username: <code>owner</code> &nbsp;|&nbsp; Password: <code>owner123</code></div>
      </div>
      <div class="credentials-hint" id="hint-staff" style="display:none;">
        <strong>Demo Credentials:</strong>
        <div>Username: <code>miguel</code> &nbsp;|&nbsp; Password: <code>staff123</code></div>
        <div>Username: <code>christian</code> &nbsp;|&nbsp; Password: <code>staff123</code></div>
      </div>

      <div id="login-error" class="alert alert-danger error-msg">❌ Invalid username or password.</div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:6px;">
          🔐 Sign In
        </button>
      </form>

      <div class="login-footer">
        DI-one Hardware &nbsp;/&nbsp; Dionee Francia &nbsp;•&nbsp; 2026
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // If already logged in, redirect
    const existing = Auth.current();
    if (existing) {
      window.location.href = existing.role === 'owner'
        ? 'dashboard-owner.html'
        : 'dashboard-staff.html';
    }

    let activeRole = 'owner';

    function switchRole(role) {
      activeRole = role;
      document.getElementById('tab-owner').classList.toggle('active', role === 'owner');
      document.getElementById('tab-staff').classList.toggle('active', role === 'staff');
      document.getElementById('hint-owner').style.display = role === 'owner' ? '' : 'none';
      document.getElementById('hint-staff').style.display = role === 'staff' ? '' : 'none';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('login-error').style.display = 'none';
    }

    function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const user = Auth.login(username, password);
      if (!user) {
        document.getElementById('login-error').style.display = 'flex';
        return;
      }
      if (user.role === 'owner') {
        window.location.href = 'dashboard-owner.html';
      } else {
        window.location.href = 'dashboard-staff.html';
      }
    }
  </script>
</body>
</html>
