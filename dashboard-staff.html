<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard – DI-One Hardware</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="topbar">
      <h1>📊 Staff Dashboard</h1>
      <div class="topbar-right">
        <span id="topbar-date"></span>
        <span class="badge badge-gray">Staff</span>
      </div>
    </div>
    <div class="page-body">

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

        <!-- My Recent Sales -->
        <div class="card">
          <div class="card-title">🛒 My Recent Transactions</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Ref</th><th>Items</th><th>Total</th><th>Date</th></tr>
              </thead>
              <tbody id="my-sales"></tbody>
            </table>
          </div>
        </div>

        <!-- Low Stock -->
        <div class="card">
          <div class="card-title">⚠️ Low Stock Alerts</div>
          <div id="low-stock-list"></div>
        </div>

      </div>

      <!-- Expiry Alerts -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:0;">
        <div class="card" style="border-top:3px solid var(--danger);">
          <div class="card-title" style="color:var(--danger);">⛔ Expired Products</div>
          <div id="expired-list"></div>
        </div>
        <div class="card" style="border-top:3px solid var(--warning);">
          <div class="card-title" style="color:var(--warning);">⏳ Expiring Soon <span style="font-size:0.78rem;font-weight:400;color:var(--text-muted);">within 30 days</span></div>
          <div id="expiring-list"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
const user = Auth.requireAny();
document.getElementById('sidebar').innerHTML = buildSidebar('staff', 'dashboard');
document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('en-PH', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

function expiryStatus(expiry) {
  if (!expiry) return 'none';
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.ceil((new Date(expiry) - today) / (1000 * 60 * 60 * 24));
  if (diffDays < 0)   return 'expired';
  if (diffDays <= 30) return 'expiring';
  return 'fresh';
}

function render() {
  const products = Store.get('products', []);
  const sales    = Store.get('sales', []);

  const mySales = sales.filter(s => s.staffId === user.id);
  const todayStr = new Date().toDateString();
  const myTodaySales = mySales.filter(s => new Date(s.date).toDateString() === todayStr);
  const myTodayRevenue = myTodaySales.reduce((a, s) => a + s.total, 0);
  const lowStock   = products.filter(p => p.stock > 0 && p.stock <= 20);
  const outOfStock = products.filter(p => p.stock <= 0);
  const expired    = products.filter(p => expiryStatus(p.expiry) === 'expired');
  const expiring   = products.filter(p => expiryStatus(p.expiry) === 'expiring')
                              .sort((a,b) => new Date(a.expiry) - new Date(b.expiry));

  // Stats
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card green">
      <div class="stat-label">My Sales Today</div>
      <div class="stat-value" style="font-size:1.4rem">${Util.fmtMoney(myTodayRevenue)}</div>
      <div class="stat-sub">${myTodaySales.length} transaction(s)</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">My Total Transactions</div>
      <div class="stat-value">${mySales.length}</div>
      <div class="stat-sub">All time</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-label">Low Stock Items</div>
      <div class="stat-value">${lowStock.length}</div>
      <div class="stat-sub">Needs attention</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">Out of Stock</div>
      <div class="stat-value">${outOfStock.length}</div>
      <div class="stat-sub">Cannot be sold</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">Expired Products</div>
      <div class="stat-value">${expired.length}</div>
      <div class="stat-sub">Must be removed</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-label">Expiring Soon</div>
      <div class="stat-value">${expiring.length}</div>
      <div class="stat-sub">Within 30 days</div>
    </div>
  `;

  // My recent sales
  const salesEl = document.getElementById('my-sales');
  if (!mySales.length) {
    salesEl.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:16px;">No transactions yet.</td></tr>';
  } else {
    salesEl.innerHTML = mySales.slice(0,8).map(s => `
      <tr>
        <td><span class="badge badge-blue">${s.ref}</span></td>
        <td>${s.items.length} item(s)</td>
        <td style="font-weight:600;color:var(--success)">${Util.fmtMoney(s.total)}</td>
        <td>${Util.fmtDate(s.date)}</td>
      </tr>
    `).join('');
  }

  // Low stock alerts
  const lowEl = document.getElementById('low-stock-list');
  const alerts = [...outOfStock.map(p => ({...p, level:'out'})), ...lowStock.map(p => ({...p, level:'low'}))];
  if (!alerts.length) {
    lowEl.innerHTML = '<div style="color:var(--success);padding:12px 0;font-size:0.88rem;">✅ All items are well-stocked.</div>';
  } else {
    lowEl.innerHTML = alerts.slice(0,8).map(p => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
        <span style="font-size:0.88rem;">${p.icon} ${p.name}</span>
        ${p.level === 'out'
          ? '<span class="badge badge-red">Out of Stock</span>'
          : `<span class="badge badge-orange">${p.stock} ${p.unit} left</span>`}
      </div>
    `).join('');
  }

  // Expired products
  const expiredEl = document.getElementById('expired-list');
  if (!expired.length) {
    expiredEl.innerHTML = '<div style="color:var(--success);padding:10px 0;font-size:0.88rem;">✅ No expired products.</div>';
  } else {
    expiredEl.innerHTML = expired.map(p => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
        <span style="font-size:0.88rem;">${p.icon} ${p.name}</span>
        <span class="badge" style="background:#fce4e4;color:#b91c1c;border:1px solid #fca5a5;">⛔ ${Util.fmtDate(p.expiry)}</span>
      </div>
    `).join('');
  }

  // Expiring soon
  const expiringEl = document.getElementById('expiring-list');
  if (!expiring.length) {
    expiringEl.innerHTML = '<div style="color:var(--success);padding:10px 0;font-size:0.88rem;">✅ No products expiring soon.</div>';
  } else {
    expiringEl.innerHTML = expiring.map(p => {
      const days = Math.ceil((new Date(p.expiry) - new Date().setHours(0,0,0,0)) / 86400000);
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:0.88rem;">${p.icon} ${p.name}</span>
          <span style="text-align:right;">
            <span class="badge" style="background:#fef9c3;color:#854d0e;border:1px solid #fde047;">⏳ ${days === 0 ? 'Today' : days + 'd left'}</span><br>
            <span style="font-size:0.72rem;color:var(--text-muted);">${Util.fmtDate(p.expiry)}</span>
          </span>
        </div>`;
    }).join('');
  }
}

render();
</script>
</body>
</html>
